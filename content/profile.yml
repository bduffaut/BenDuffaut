about:
  - >-
    I'm a full-stack software engineer finishing my Computer Science degree at UCF. I like owning
    a feature from end to end: the data it needs, the logic behind it, the interface people use,
    and how it gets deployed. Most recently I interned at Reveal Security, working directly with
    the CTO and product lead. I wrote the PostgreSQL queries that fed a customizable security
    dashboard, built the Vue features on top of it, and tested both sides.
  - >-
    On my senior design team I'm the Scrum Master and own DevOps, and I build much of the Python
    engine: an async runner that scores thousands of test cases concurrently and streams every
    result to disk, plus the data models and loaders underneath it. I run my own infrastructure
    too. This site lives on a Linux server in my apartment and deploys itself every time I push.
  - >-
    I still have a soft spot for the frontend. After Reveal I wanted to understand grid layouts
    properly, so I wrote my own drag-and-drop engine and published it on npm. It powers the
    projects board on this page. I care how things look, but I care more about whether they
    actually make someone's work easier.
beyond:
  - title: UCF Club Tennis
    meta: National team · 2023 to present
    stat: 12th
    body: >-
      Three straight years on the national team. We qualified for USTA/ITA Club Tennis Nationals
      and finished 12th in the country. Tennis is also why my ML project analyzes match video.
  - title: Under the hood
    meta: Car projects · Always ongoing
    icon: wrench
    body: >-
      Away from the keyboard, I'm usually in the garage working on my car. It scratches the same
      itch as engineering: figure out how something works, track down what's wrong, and fix it
      properly instead of just making the symptom go away.
