about:
  - >-
    I'm a software engineer finishing my Computer Science degree at UCF. I do my best work on the
    frontend: component systems, dashboards, and the interaction details that make an interface
    feel fast and intentional. I care about how things look, but I care more about whether they
    actually make someone's work easier.
  - >-
    Most recently I interned at Reveal Security, where I shipped production Vue features working
    directly with the CTO and product lead, from a customizable security dashboard to the tests
    behind it. That dashboard got me curious about how grid layouts really work, so I built my own
    engine from scratch and published it on npm. It's the project I'm proudest of, and it powers
    the projects board on this page.
  - >-
    I'm comfortable across the stack, from Node and Express APIs to MongoDB, Postgres, Docker and
    CI, and I've built applied machine learning systems in PyTorch. I also like owning things end
    to end: this site runs on a laptop server in my apartment and deploys itself every time I push.
